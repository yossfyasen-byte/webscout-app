<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebScout</title>
<style>
:root{color-scheme:dark}
html,body{margin:0;height:100%;background:#05070a;color:#e8ecf3;font-family:system-ui,sans-serif;overflow:hidden}
#rain{position:fixed;inset:0;width:100%;height:100%;opacity:.28}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
#intro{display:flex;flex-direction:column;align-items:center;transition:opacity .5s}
#intro.gone{opacity:0;pointer-events:none}
.stage{position:relative;width:220px;height:220px;display:flex;align-items:center;justify-content:center}
.radar{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,77,109,.35);
  background:radial-gradient(circle,rgba(255,77,109,.08) 0,transparent 70%);
  box-shadow:0 0 30px rgba(255,77,109,.15) inset}
.radar::before,.radar::after{content:"";position:absolute;inset:18%;border-radius:50%;border:1px dashed rgba(255,77,109,.25)}
.radar::after{inset:38%;border-style:solid;border-color:rgba(255,77,109,.3)}
.sweep{position:absolute;inset:0;border-radius:50%;
  background:conic-gradient(from 0deg,rgba(255,77,109,0) 0deg,rgba(255,77,109,.55) 40deg,rgba(255,77,109,0) 60deg);
  animation:spin 2.4s linear infinite}
.dot{position:absolute;width:6px;height:6px;border-radius:50%;background:#ff4d6d;box-shadow:0 0 10px #ff4d6d;opacity:0;animation:blip 2.4s ease-out infinite}
.dot.a{left:34%;top:28%;animation-delay:.3s}
.dot.b{left:66%;top:58%;animation-delay:1.1s}
.dot.c{left:44%;top:72%;animation-delay:1.8s}
.logo{position:relative;font-size:40px;font-weight:800;letter-spacing:.5px;color:#ff4d6d;text-shadow:0 0 18px rgba(255,77,109,.55);
  opacity:0;transform:scale(.8);animation:logo .9s .1s cubic-bezier(.2,.8,.2,1) forwards}

.sub{margin-top:12px;color:#8b93a7;font-size:15px;opacity:0;animation:fade .6s .8s forwards}
.feats{margin-top:22px;display:grid;gap:10px;width:min(320px,80%)}
.feat{background:rgba(21,25,34,.85);border:1px solid #252c3b;border-radius:14px;padding:12px 14px;font-size:14px;opacity:0;transform:translateY(10px);animation:up .5s forwards;text-align:right}
.feat:nth-child(1){animation-delay:1.3s}
.feat:nth-child(2){animation-delay:1.7s}
.feat:nth-child(3){animation-delay:2.1s}
#load{position:absolute;bottom:0;left:0;right:0;padding:20px 28px 40px;opacity:0;transition:opacity .4s}
#load.on{opacity:1}
#term{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#3ddc97;text-align:left;direction:ltr;height:54px;overflow:hidden;margin:0 0 14px;opacity:.85;
  -webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%)}
#term div{white-space:nowrap}
.bar{height:6px;border-radius:99px;background:#1c2230;overflow:hidden;position:relative}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ff4d6d,#ff8fa3);box-shadow:0 0 12px rgba(255,77,109,.6)}
.row{display:flex;justify-content:space-between;margin-top:10px;font-size:13px;color:#8b93a7}
#pct{font-family:ui-monospace,Menlo,Consolas,monospace;color:#ff8fa3}
@keyframes logo{to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes up{to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:0;transform:scale(.4)}10%{opacity:1;transform:scale(1)}60%,100%{opacity:0;transform:scale(1.6)}}
@keyframes scan{0%,100%{top:0}50%{top:calc(100% - 2px)}}
@media (prefers-reduced-motion:reduce){.sweep,.logo::after,.dot{animation:none}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
<div class="wrap">
  <div id="intro">
    <div class="stage">
      <div class="radar"></div>
      <div class="sweep"></div>
      <span class="dot a"></span><span class="dot b"></span><span class="dot c"></span>
      <div class="logo">WebScout</div>
    </div>
    <div class="sub">أداة فحص أمني للمواقع</div>
    <div class="feats">
      <div class="feat">فحص المنافذ والخدمات المكشوفة</div>
      <div class="feat">نتائج مع طريقة المعالجة</div>
      <div class="feat">سجلات محفوظة في الهاتف</div>
    </div>
  </div>
  <div id="load">
    <div id="term"></div>
    <div class="bar"><div id="fill"></div></div>
    <div class="row"><span id="msg">تهيئة التطبيق</span><span id="pct">0%</span></div>
  </div>
</div>
<script>
const SERVER = 'http://127.0.0.1:8765/';
const OFFLINE = 'file:///android_asset/offline.html';
const fill = document.getElementById('fill');
const msg = document.getElementById('msg');
const pct = document.getElementById('pct');
const term = document.getElementById('term');

/* خلفية: مطر أرقام وحروف عشوائية (خفيفة) */
(function rain(){
  const c = document.getElementById('rain'), g = c.getContext('2d');
  const chars = '01ABCDEF<>/{}[]#$%';
  let cols, drops;
  function size(){
    c.width = innerWidth; c.height = innerHeight;
    cols = Math.floor(c.width / 16);
    drops = Array.from({length: cols}, () => Math.random() * c.height / 16);
  }
  size(); addEventListener('resize', size);
  setInterval(() => {
    g.fillStyle = 'rgba(5,7,10,.12)'; g.fillRect(0, 0, c.width, c.height);
    g.fillStyle = '#ff4d6d'; g.font = '14px monospace';
    for (let i = 0; i < cols; i++) {
      g.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, drops[i] * 16);
      if (drops[i] * 16 > c.height && Math.random() > .975) drops[i] = 0;
      drops[i] += .6;
    }
  }, 60);
})();

/* سطور تشبه سجل الفحص */
const LINES = [
  'resolving target ................. ok',
  'probing ports 80,443,8080 ........ open',
  'crawling links ................... 48 found',
  'checking security headers ........ done',
  'testing parameters ............... 12 inputs',
  'tls handshake .................... TLSv1.3',
  'scanning sensitive paths ......... 186 req',
  'analyzing responses .............. ok',
  'loading rules .................... 47 checks',
  'session guard .................... armed'
];
let li = 0;
const logTimer = setInterval(() => {
  if (!term.offsetParent) return;
  const d = document.createElement('div');
  d.textContent = '> ' + LINES[li % LINES.length];
  term.appendChild(d);
  while (term.children.length > 4) term.removeChild(term.firstChild);
  li++;
}, 380);

function termuxOk() {
  try { return window.Android && Android.termuxInstalled ? !!Android.termuxInstalled() : true; }
  catch (e) { return true; }
}
function label(p) {
  if (p < 25) return 'تهيئة محرك الفحص';
  if (p < 50) return 'تحميل قواعد الفحص';
  if (p < 75) return 'التحقق من تيرمكس';
  if (p < 100) return 'التحقق من السيرفر';
  return 'النظام جاهز';
}
function serverUp() {
  const ping = fetch(SERVER + 'manifest.json', { mode: 'no-cors', cache: 'no-store' }).then(() => true, () => false);
  const timeout = new Promise(res => setTimeout(() => res(false), 1500));
  return Promise.race([ping, timeout]);
}
function setProgress(p) {
  fill.style.width = p + '%';
  pct.textContent = p + '%';
  msg.textContent = label(p);
}

setTimeout(() => {
  document.getElementById('intro').classList.add('gone');
  document.getElementById('load').classList.add('on');
  let p = 0;
  const timer = setInterval(() => {
    p = Math.min(100, p + 2);
    setProgress(p);
    if (p >= 100) {
      clearInterval(timer);
      clearInterval(logTimer);
      setTimeout(finish, 250);
    }
  }, 50);
}, 3000);

async function finish() {
  if (!termuxOk()) { location.replace(OFFLINE); return; }
  const up = await serverUp();
  location.replace(up ? SERVER : OFFLINE);
}
</script>
</body>
</html>
