<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#0b0d12;color:#e8ecf3;font:16px/1.6 system-ui,sans-serif;padding:24px;text-align:center}
h1{font-size:22px;margin:40px 0 8px}
p{color:#8b93a7;margin:6px 0}
button{background:#ff4d6d;color:#fff;border:0;border-radius:14px;padding:14px 22px;font:inherit;font-weight:700;margin:10px 6px;min-width:200px}
button.g{background:#1c2230;color:#e8ecf3}
.box{background:#151922;border:1px solid #252c3b;border-radius:16px;padding:14px;margin:22px auto;max-width:420px;text-align:right;font-size:14px;color:#8b93a7}
code{direction:ltr;unicode-bidi:isolate;color:#e8ecf3}
</style>
</head>
<body>
<h1>السيرفر مش شغّال</h1>
<p>ZeroSpecter بيشتغل عبر تيرمكس.</p>
<button id="start">تشغيل السيرفر</button><br>
<button class="g" id="retry">إعادة المحاولة</button>
<div class="box">
أول مرة؟ بتيرمكس نفّذ سكربت التثبيت <code>setup_termux.sh</code> مرة وحدة، وبعدين ارجع هون.<br>
وإذا زر التشغيل ما زبط، شغّل السيرفر يدوياً:<br>
<code>cd ~/zerospecter-ui &amp;&amp; python zs_server.py</code>
</div>
<p id="st"></p>
<script>
const SERVER='http://127.0.0.1:8765/';
document.getElementById('start').onclick=()=>{if(window.Android)Android.startServer()};
document.getElementById('retry').onclick=()=>{location.href=SERVER};
async function ping(){
  try{await fetch(SERVER+'manifest.json',{mode:'no-cors',cache:'no-store'});location.href=SERVER}
  catch(e){document.getElementById('st').textContent='بنتظر السيرفر...'}
}
setInterval(ping,2000);
</script>
</body>
</html>
