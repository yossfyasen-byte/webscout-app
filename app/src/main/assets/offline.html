<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WebScout</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0b0d12;color:#e8ecf3;font:16px/1.7 system-ui,sans-serif;padding:24px 18px 40px;text-align:center}
h1{font-size:22px;margin:28px 0 6px}
p{color:#8b93a7;margin:6px 0}
button{background:#ff4d6d;color:#fff;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;margin:8px 4px;min-width:150px;cursor:pointer}
button.g{background:#1c2230;color:#e8ecf3;border:1px solid #252c3b}
.card{background:#151922;border:1px solid #252c3b;border-radius:16px;padding:16px;margin:18px auto;max-width:440px;text-align:right}
.step{display:flex;gap:10px;align-items:flex-start;margin:10px 0;color:#c7cdd9;font-size:15px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:#ff4d6d;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.cmd{direction:ltr;text-align:left;background:#0b0d12;border:1px solid #252c3b;border-radius:12px;padding:12px;margin:10px 0;color:#e8ecf3;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;white-space:pre-wrap}
.copy{width:100%;min-width:0}
#st{min-height:24px;color:#8b93a7;font-size:14px}
#no{display:none}
</style>
</head>
<body>
<div id="down">
  <h1>السيرفر مش شغّال</h1>
  <p>هالتطبيق بيشتغل بعد التفعيل.</p>

  <div class="card">
    <div class="step"><span class="num">1</span><span>التطبيق بيفتح تيرمكس ويشغّل الأداة تلقائياً.</span></div>
    <div class="step"><span class="num">2</span><span>إذا طلب إذن، وافق عليه.</span></div>
    <div class="step"><span class="num">3</span><span>انتظر ثواني، والصفحة بتفتح لحالها.</span></div>
  </div>

  <button id="start">تشغيل من التطبيق</button>
  <button class="g" id="retry">إعادة المحاولة</button>
  <p id="st"></p>

</div>

<div id="no">
  <h1>تيرمكس مش مثبّت</h1>
  <p>التطبيق بيحتاج تيرمكس عشان يشغّل الأداة.</p>
  <div class="card">
    <div class="step"><span class="num">1</span><span>ثبّت تيرمكس من F-Droid (مش من Play).</span></div>
    <div class="step"><span class="num">2</span><span>افتح التطبيق من جديد.</span></div>
  </div>
  <button class="g" id="retry2">إعادة المحاولة</button>
</div>

<script>
const SERVER = 'http://127.0.0.1:8765/';
const st = document.getElementById('st');

function termuxOk() {
  try { return window.Android && Android.termuxInstalled ? !!Android.termuxInstalled() : true; }
  catch (e) { return true; }
}
function toast(t) {
  try { if (window.Android && Android.toast) Android.toast(t); } catch (e) {}
}
document.getElementById('start').onclick = () => {
  if (window.Android && Android.startServer) Android.startServer();
};
document.getElementById('retry').onclick = () => location.replace(SERVER);
document.getElementById('retry2').onclick = () => location.reload();

async function ping() {
  try {
    await fetch(SERVER + 'manifest.json', { mode: 'no-cors', cache: 'no-store' });
    location.replace(SERVER);
  } catch (e) {
    st.textContent = 'بنتظر السيرفر...';
  }
}
let autoTried = false;
try { autoTried = sessionStorage.getItem('zsAuto') === '1'; } catch (e) {}
if (termuxOk() && !autoTried) {
  try { sessionStorage.setItem('zsAuto', '1'); } catch (e) {}
  setTimeout(() => { if (window.Android && Android.startServer) Android.startServer(); }, 800);
}
if (!termuxOk()) {
  document.getElementById('down').style.display = 'none';
  document.getElementById('no').style.display = 'block';
} else {
  setInterval(ping, 2000);
}
</script>
</body>
</html>
